<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Wireframe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <span class="wf-badge">WIREFRAME</span>
  <div class="auth-page">
    <div class="auth-card" style="width:420px;">
      <h1>Create Account</h1>
      <div class="form-group"><label>First Name</label><div class="input"></div></div>
      <div class="form-group"><label>Last Name</label><div class="input"></div></div>
      <div class="form-group"><label>Email</label><div class="input"></div></div>
      <div class="form-group"><label>Department</label><div class="input"></div></div>
      <div class="form-group"><label>Password</label><div class="input"></div></div>
      <div class="form-group"><label>Confirm Password</label><div class="input"></div></div>
      <div class="btn btn-primary" style="width:100%; text-align:center;">Register</div>
      <p style="text-align:center; margin-top:16px;"><a href="login.html">Already have an account?</a></p>
    </div>
  </div>
</body>
</html>
