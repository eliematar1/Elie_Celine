<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Ticket — Wireframe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <span class="wf-badge">WIREFRAME</span>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">IT Help Desk</div>
      <nav>
        <a href="create-ticket.html" class="active">Create Ticket</a>
        <a href="ticket-list.html">My Tickets</a>
      </nav>
    </aside>
    <div class="main">
      <div class="content">
        <h1 class="page-title">Create Support Ticket</h1>
        <div class="card" style="max-width:640px; margin-bottom:16px; background:#ebf8ff;">
          <h3>💬 AI Assistant (optional)</h3>
          <p style="font-size:13px;">Ask a question before opening a ticket — e.g. "How do I connect to VPN?"</p>
          <div class="input" style="height:40px; margin-top:8px;"></div>
        </div>
        <div class="card" style="max-width:640px;">
          <div class="form-group"><label>Title *</label><div class="input"></div></div>
          <div class="form-group"><label>Description *</label><textarea class="input"></textarea></div>
          <div class="form-group"><label>Category *</label><div class="input"></div></div>
          <div class="form-group"><label>Priority</label><div class="input"></div></div>
          <div class="form-group"><label>Attachments</label><span class="btn">Choose files</span></div>
          <span class="btn btn-primary">Submit Ticket</span>
          <a href="ticket-list.html" class="btn" style="margin-left:8px;">Cancel</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
