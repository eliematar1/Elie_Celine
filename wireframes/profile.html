<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — Wireframe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <span class="wf-badge">WIREFRAME</span>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">IT Help Desk</div>
      <nav><a href="profile.html" class="active">Profile</a></nav>
    </aside>
    <div class="main">
      <div class="content">
        <h1 class="page-title">My Profile</h1>
        <div class="card" style="max-width:480px;">
          <div style="width:80px;height:80px;background:#ddd;border-radius:50%;margin-bottom:16px;"></div>
          <div class="form-group"><label>First Name</label><div class="input"></div></div>
          <div class="form-group"><label>Last Name</label><div class="input"></div></div>
          <div class="form-group"><label>Email</label><div class="input"></div></div>
          <div class="form-group"><label>Phone</label><div class="input"></div></div>
          <div class="form-group"><label>Department</label><div class="input"></div></div>
          <span class="btn btn-primary">Save changes</span>
          <hr style="margin:20px 0; border:none; border-top:1px dashed #ccc;"/>
          <h3>Change Password</h3>
          <div class="form-group"><label>Current password</label><div class="input"></div></div>
          <div class="form-group"><label>New password</label><div class="input"></div></div>
          <span class="btn">Update password</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
